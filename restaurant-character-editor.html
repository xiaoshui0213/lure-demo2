<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LURE · 经营角色编辑器</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #0b1015;
        color: #eee4d7;
      }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; grid-template-columns: minmax(0, 1fr) 350px; }
      main { display: grid; place-items: center; min-width: 0; padding: 18px; background: #080d12; }
      #scene-canvas {
        position: relative;
        width: min(100%, calc((100vh - 36px) * 16 / 9));
        aspect-ratio: 16 / 9;
        border: 1px solid #66564e;
        background: #251a18;
      }
      #scene-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
      aside { overflow: auto; padding: 18px; border-left: 1px solid #443833; background: #171d22; }
      h1 { margin: 0 0 6px; font-size: 21px; }
      p { margin: 0 0 16px; color: #a99c91; font-size: 13px; line-height: 1.55; }
      h2 { margin: 18px 0 9px; color: #dfc59f; font-size: 15px; }
      .poses { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      button {
        border: 1px solid #6b5b51;
        padding: 9px;
        color: #eee2d3;
        background: #2b343b;
        cursor: pointer;
      }
      button:hover { background: #3a454d; }
      button.active { border-color: #e0b879; color: #fff2cf; background: #65503c; }
      button.primary { border-color: #b88955; background: #765238; }
      .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      label { display: grid; gap: 5px; color: #b8aaa0; font-size: 12px; }
      input {
        width: 100%;
        border: 1px solid #4b555b;
        padding: 8px;
        color: #f0e8df;
        background: #0c1318;
      }
      .scale { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 9px; }
      .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
      #status { min-height: 18px; margin-top: 12px; color: #e0bb7d; font-size: 12px; }
      .hint { margin-top: 16px; padding-top: 12px; border-top: 1px solid #384047; color: #87939b; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main><div id="scene-canvas"></div></main>
    <aside>
      <h1>经营角色编辑器</h1>
      <p>选择一种动作后直接拖动角色。宽高会应用到该动作的全部帧，保存后刷新钓鱼 Demo 即可生效。</p>

      <h2>编辑对象</h2>
      <div class="poses">
        <button data-pose="playerIdle">主角 · 正面</button>
        <button data-pose="playerWalk">主角 · 走路</button>
        <button data-pose="youngWomanWalk">女顾客 · 走路</button>
        <button data-pose="youngWomanSeated">女顾客 · 坐姿</button>
      </div>

      <h2>位置与大小</h2>
      <div class="form">
        <label>X 偏移<input id="offset-x" type="number" min="-500" max="500" step="1" /></label>
        <label>Y 偏移<input id="offset-y" type="number" min="-500" max="500" step="1" /></label>
        <label>显示宽度<input id="width" type="number" min="10" max="500" step="1" /></label>
        <label>显示高度<input id="height" type="number" min="20" max="500" step="1" /></label>
      </div>
      <div class="scale">
        <button id="scale-down">缩小 10%</button>
        <button id="scale-reset">恢复此动作</button>
        <button id="scale-up">放大 10%</button>
      </div>

      <div class="toolbar">
        <button id="save" class="primary">保存并应用</button>
        <button id="open-game">打开钓鱼 Demo</button>
        <button id="reset-all">全部恢复默认</button>
        <button id="toggle-animation">暂停动画</button>
      </div>
      <div id="status"></div>
      <div class="hint">
        拖动：调整当前动作位置<br />
        方向键：每次移动 1px；Shift + 方向键：每次移动 10px<br />
        画面中的十字是角色容器锚点，不会出现在游戏中。
      </div>
    </aside>
    <script type="module" src="/src/restaurant-character-editor/main.ts"></script>
  </body>
</html>
