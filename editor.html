<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LURE · Scene Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0a1522;
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e8ecef;
      }
      #viewport { position: fixed; inset: 0; }

      /* ─── 左侧：模型库 / 工具 ─── */
      #palette {
        position: fixed; left: 0; top: 0; bottom: 40px; width: 220px;
        background: rgba(15, 22, 35, 0.92); backdrop-filter: blur(10px);
        border-right: 1px solid rgba(255,255,255,0.06);
        overflow-y: auto; padding: 14px;
        z-index: 10;
      }
      #palette h2 {
        font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
        color: #6b8395; margin: 14px 0 8px; font-weight: 500;
      }
      #palette h2:first-child { margin-top: 0; }
      .tool-row { display: flex; gap: 6px; margin-bottom: 4px; }
      .btn {
        flex: 1; padding: 8px 10px; border-radius: 6px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
        color: #cbd5df; font-size: 12px; cursor: pointer;
        transition: background 0.1s, border 0.1s;
      }
      .btn:hover { background: rgba(255,255,255,0.08); }
      .btn.active { background: #2b7fff33; border-color: #2b7fff; color: #fff; }
      .btn.danger { background: #ff4d5522; border-color: #ff4d5566; color: #ffb0b3; }
      .btn.danger:hover { background: #ff4d5544; }

      .model-card {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; margin-bottom: 4px;
        border-radius: 6px; cursor: pointer;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
        transition: background 0.1s, border 0.1s;
      }
      .model-card:hover { background: rgba(255,255,255,0.07); }
      .model-card.active { background: #2b7fff33; border-color: #2b7fff; }
      .model-swatch {
        width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0;
        border: 1px solid rgba(255,255,255,0.15);
      }
      .model-info { flex: 1; }
      .model-name { font-size: 12px; color: #e0e5ea; }
      .model-hint { font-size: 10px; color: #6b8395; margin-top: 2px; }
      .kbd {
        display: inline-block; padding: 1px 5px; margin: 0 2px;
        border-radius: 3px; background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12); color: #cbd5df;
        font-size: 10px; font-family: ui-monospace, monospace;
      }

      /* ─── 右侧：Inspector ─── */
      #inspector {
        position: fixed; right: 0; top: 0; bottom: 40px; width: 260px;
        background: rgba(15, 22, 35, 0.92); backdrop-filter: blur(10px);
        border-left: 1px solid rgba(255,255,255,0.06);
        overflow-y: auto; padding: 14px;
        z-index: 10;
      }
      #inspector h2 {
        font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
        color: #6b8395; margin: 14px 0 8px; font-weight: 500;
      }
      #inspector h2:first-child { margin-top: 0; }
      .field { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .field label { flex: 0 0 60px; font-size: 11px; color: #8ea2b3; }
      .field input[type="number"], .field input[type="text"] {
        flex: 1; padding: 6px 8px; background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
        color: #e0e5ea; font-size: 12px; font-family: inherit;
      }
      .field input[type="number"] { -moz-appearance: textfield; }
      .field input[type="number"]::-webkit-outer-spin-button,
      .field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .field.axis-x input { border-bottom: 2px solid #ff4d55aa; }
      .field.axis-y input { border-bottom: 2px solid #4dff88aa; }
      .field.axis-z input { border-bottom: 2px solid #4d8fffaa; }
      .empty-hint { color: #6b8395; font-size: 12px; text-align: center; margin-top: 40px; }

      /* ─── 顶部：Toolbar ─── */
      #toolbar {
        position: fixed; top: 0; left: 220px; right: 260px; height: 44px;
        background: rgba(15, 22, 35, 0.92); backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex; align-items: center; padding: 0 14px; gap: 8px;
        z-index: 10;
      }
      #toolbar .title { font-size: 13px; color: #e0e5ea; font-weight: 500; }
      #toolbar .spacer { flex: 1; }
      #toolbar .btn { flex: none; padding: 6px 12px; }

      /* ─── 底部：Status ─── */
      #status {
        position: fixed; bottom: 0; left: 0; right: 0; height: 40px;
        background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.06);
        display: flex; align-items: center; padding: 0 14px; gap: 20px;
        font-size: 11px; color: #8ea2b3;
        z-index: 10;
      }
      #status .stat { display: flex; align-items: center; gap: 6px; }
      #status .stat b { color: #cbd5df; font-weight: 500; }
      #status .separator { color: rgba(255,255,255,0.15); }

      #file-input { display: none; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>

    <div id="palette">
      <h2>模型库</h2>
      <div id="model-list"></div>
      <div class="tool-row" style="margin-top:6px;">
        <button class="btn" id="import-model" title="选择本地 .glb / .gltf 文件（也可直接拖拽进窗口）">+ 导入 .glb / .gltf</button>
      </div>
      <input type="file" id="model-file-input" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" style="display:none;" />

      <h2>工具</h2>
      <div id="tool-list"></div>

      <h2>视图</h2>
      <div class="tool-row">
        <button class="btn" id="view-top">顶视</button>
        <button class="btn" id="view-persp">透视</button>
      </div>
      <div class="tool-row">
        <button class="btn" id="toggle-grid">切换网格</button>
        <button class="btn" id="toggle-water">切换水面</button>
      </div>
      <div class="tool-row">
        <button class="btn" id="play-mode">▶ 试玩</button>
      </div>

      <h2>快捷键</h2>
      <div style="font-size: 11px; color: #8ea2b3; line-height: 1.7;">
        <span class="kbd">左键</span> 放置 / 选中<br/>
        <span class="kbd">右键</span> 删除<br/>
        <span class="kbd">中键拖拽</span> 平移视角<br/>
        <span class="kbd">滚轮</span> 缩放视角<br/>
        <br/>
        <b style="color:#cbd5df;">放置模式 · 选中后</b><br/>
        <span class="kbd">W</span> 位移 · <span class="kbd">E</span> 旋转 · <span class="kbd">R</span> 缩放 (gizmo)<br/>
        <span class="kbd">Shift</span> (按住) 取消吸附<br/>
        <span class="kbd">[</span> <span class="kbd">]</span> 旋转 90°<br/>
        <br/>
        <b style="color:#cbd5df;">选择模式</b><br/>
        按住节点直接拖动 → 松手吸附到格子<br/>
        <br/>
        <span class="kbd">Del</span> 删除 · <span class="kbd">Esc</span> 取消
      </div>
    </div>

    <div id="toolbar">
      <div class="title">LURE Scene Editor</div>
      <span id="scene-name" style="font-size: 12px; color: #6b8395;">— 未命名场景 —</span>
      <div class="spacer"></div>
      <button class="btn" id="new-scene">新建</button>
      <button class="btn" id="save-scene">保存</button>
      <button class="btn" id="load-scene">导入 JSON</button>
      <button class="btn" id="download-scene">下载 JSON</button>
      <button class="btn danger" id="clear-scene">清空</button>
      <input type="file" id="file-input" accept="application/json" />
    </div>

    <div id="inspector">
      <div id="inspector-body"></div>
    </div>

    <div id="status">
      <div class="stat">工具: <b id="stat-tool">放置</b></div>
      <div class="separator">|</div>
      <div class="stat">Gizmo: <b id="stat-gizmo">位移(W)</b></div>
      <div class="separator">|</div>
      <div class="stat">当前模型: <b id="stat-model">—</b></div>
      <div class="separator">|</div>
      <div class="stat">Cell: <b id="stat-cell">—</b></div>
      <div class="separator">|</div>
      <div class="stat">节点数: <b id="stat-count">0</b></div>
      <div class="separator">|</div>
      <div class="stat">FPS: <b id="stat-fps">—</b></div>
    </div>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
