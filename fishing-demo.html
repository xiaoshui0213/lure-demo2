<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LURE · 2D 钓鱼最小循环</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #091522;
        font-family: "Noto Serif SC", "SimSun", serif;
        font-weight: 300;
      }
      body {
        display: grid;
        place-items: center;
      }
      #game {
        width: min(100vw, 1280px);
        aspect-ratio: 16 / 9;
        max-height: 100vh;
      }
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/fishing-demo/main.ts"></script>
  </body>
</html>
